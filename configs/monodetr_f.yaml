random_seed: 444

dataset:
  type: &dataset_type 'KITTI'
  root_dir: '/home/hice1/rrustagi7/scratch/final_ai2_kitti'  # updated to final_ai2_kitti
  train_split: 'train'
  test_split: 'val'
  batch_size: 8
  use_3d_center: True
  class_merging: False
  use_dontcare: False
  bbox2d_type: 'anno'  # 'proj' or 'anno'
  meanshape: False  # use predefined anchor or not
  # List of all classes found in the dataset (used by AI2THOR loader)
  class_names: &class_names ['Bed', 'Cabinet', 'Chair', 'Desk', 'DiningTable', 'Drawer', 'Shelf', 'SideTable', 'Sink', 'SinkBasin', 'Sofa']
  # By default use the full class_names as the writelist (loader will process these types)
  writelist: *class_names
  clip_2d: False
  class_mean_sizes:
      Bed: [1.083155, 1.684365, 1.924093]
      Cabinet: [0.666354, 0.409959, 0.416964]
      Chair: [0.959852, 0.590336, 0.601609]
      Desk: [1.002056, 1.192161, 1.249042]
      DiningTable: [0.813822, 1.124908, 1.138764]
      Drawer: [0.213219, 0.460087, 0.483194]
      Shelf: [0.269391, 0.729941, 0.493001]
      SideTable: [0.789589, 0.679653, 0.605090]
      Sink: [0.316153, 0.602649, 0.614178]
      SinkBasin: [0.139482, 0.458383, 0.420819]
      Sofa: [1.025742, 1.942374, 1.606155]

  # Model / loader resolution settings (required by the AI2THOR KITTI loader)
  input_resolution: [1280, 384]
  output_downsample: 4

  aug_pd: True
  aug_crop: True

  random_flip: 0.5
  random_crop: 0.5
  scale: 0.05
  shift: 0.05

  depth_scale: 'normal'


model_name: 'monodinodetr'
model:
  num_classes: 11   # updated to number of classes in final_ai2_kitti
  return_intermediate_dec: True
  device: 'cuda'

  # Backbone
  backbone: 'vits'          # resnet50, dla34, dla60, vits, vitb tested
  train_backbone: False
  num_feature_levels: 3
  dilation: False
  position_embedding: 'sine'  # 'sine' or 'learned'
  masks: False

  # Depth predictor
  depth_predict_with_anything: True
  depth_predict_encoder: 'vits'
  mode: LID
  num_depth_bins: 80      # 80
  depth_min: 1e-3
  depth_max: 15.0        # 60.0

  # Transformer
  with_box_refine: True
  two_stage: False
  use_dab: True
  use_dn: False
  two_stage_dino: False
  init_box: False
  enc_layers: 3
  dec_layers: 3
  hidden_dim: 256
  dim_feedforward: 256
  dropout: 0.1
  nheads: 8
  num_queries: 50
  enc_n_points: 4
  dec_n_points: 4

  # DN
  scalar: 5
  label_noise_scale: 0.2
  box_noise_scale: 0.4
  num_patterns: 0
  
  # Loss
  aux_loss: True

  # Loss coefficients
  cls_loss_coef: 2
  focal_alpha: 0.25

  bbox_loss_coef: 5
  giou_loss_coef: 2
  3dcenter_loss_coef: 10
  dim_loss_coef: 1
  angle_loss_coef: 1
  depth_loss_coef: 1
  depth_map_loss_coef: 1

  # Matcher
  set_cost_class: 2
  set_cost_bbox: 5
  set_cost_giou: 2
  set_cost_3dcenter: 10


optimizer:
  type: 'adamw'
  lr: 0.0002
  weight_decay: 0.0001


lr_scheduler:
  type: 'step'  # 'step' or 'cos'
  warmup: False  # 5 epoches, cosine warmup, init_lir=0.00001 in default
  decay_rate: 0.1
  decay_list: [125, 165]


trainer:
  max_epoch: 195
  gpu_ids: '0,1,2,3'
  save_frequency: 1  # checkpoint save interval (in epoch)
  batch_size_per_gpu: 8
  resume_model: True
  # pretrain_model: path/to/ckpt
  save_path: 'outputs/'
  save_all: False  # False for only savng the best and latest ckpts
  use_dn: False
  scalar: 1
  label_noise_scale: 0.2
  box_noise_scale: 0.4
  num_patterns: 0
  contrastive: False

tester:
  type: *dataset_type
  mode: single  # 'single' or 'all'; 'all' to evaluate all ckpts in the folder
  checkpoint: 195  # the start ckpt epoch for 'all'
  threshold: 0.2  # confidence filter
  topk: 50
  use_dn: False
