  # --- Other Dataset Settings ---
  use_3d_center: True
  # class_merging: False # Not relevant for AI2THOR classes
  bbox2d_type: 'anno'
  clip_2d: True # Recommended: Clip augmented 2D boxes to image boundaries

  # --- Augmentation ---
  aug_pd: True     # Photometric distortions
  aug_crop: True     # Random crop/scale/shift
  aug_calib: False   # Keep False for synthetic data

  random_flip: 0.5
  random_crop: 0.5   # Probability of applying crop aug
  scale: 0.2       # Increased scale variation (e.g., +/- 20%)
  shift: 0.1       # Increased shift variation (e.g., +/- 10%)

  depth_scale: 'normal' # Correct interaction with scale augmentation


model_name: 'monodinodetr' # Renamed for clarity
model:
  num_classes: 109 # <<< TEMPORARILY REDUCED to test if class count is causing issues
  return_intermediate_dec: True
  device: 'cuda'

  # --- Backbone ---
  # Ensure your codebase correctly loads DINO weights for 'vitl'
  # Or use a specific identifier if required (e.g., 'dinov3_vitl16')
  backbone: 'vitl'
  # checkpoint: '/path/to/your/dinov3_vitl_pretrain.pth' # Optional: Specify explicit DINO weights path if needed
  train_backbone: True # Fine-tune the backbone on the indoor data
  num_feature_levels: 3
  dilation: False
  position_embedding: 'sine'
  masks: False # Typically False for object detection

  # --- Depth Predictor ---
  depth_predict_with_anything: True # Assuming using DepthAnything approach
  depth_predict_encoder: 'vitl'     # Match backbone size if required by implementation
  mode: LID
  num_depth_bins: 80
  depth_min: 1e-3
  depth_max: 10.0 # Reduced: Max depth relevant for indoor scenes (adjust if needed)

  # --- Transformer ---
  with_box_refine: True
  two_stage: False
  use_dab: True # Use DAB-DETR anchor boxes
  use_dn: False # Temporarily disabled DN to debug OOM issue
  two_stage_dino: False # Specific DN variant control
  init_box: True # Recommended with DAB/DN
  enc_layers: 6 # Increased depth
  dec_layers: 6 # Increased depth
  hidden_dim: 256
  dim_feedforward: 2048 # Increased FFN dimension (adjust based on memory)
  dropout: 0.1
  nheads: 8
  num_queries: 50 # Must be multiple of 50 for this architecture! (50, 100, 150, 200, 250, 300)
  enc_n_points: 4
  dec_n_points: 4

  # --- DN (Denoising) Configuration (if use_dn: True) ---
  scalar: 2 # Very small for 109 classes (note: trainer uses scalar*11 internally!)
  label_noise_scale: 0.2 # Or 0.5? Tune based on convergence
  box_noise_scale: 0.4 # Or 1.0? Tune based on convergence
  num_patterns: 0 # Standard for DN

  # --- Loss ---
  aux_loss: True # Use intermediate decoder layer losses

  # --- Loss Coefficients ---
  # Keep defaults initially, tune based on performance bottlenecks
  cls_loss_coef: 2.0
  focal_alpha: 0.25 # Standard for Focal Loss

  bbox_loss_coef: 5.0 # L1 loss
  giou_loss_coef: 2.0 # GIoU loss

  # 3D specific losses
  # Re-enabled with reduced coefficients for stability
  depth_loss_coef: 0.5 # Reduced from 1.0 for stability
  3dcenter_loss_coef: 10.0 # Weight for projected 3D center offset
  dim_loss_coef: 0.5 # Reduced from 1.0 for stability
  angle_loss_coef: 0.5 # Reduced from 1.0 for stability
  depth_map_loss_coef: 0.5 # Reduced from 1.0 for stability

  # --- Matcher ---
  # Keep defaults initially
  set_cost_class: 2.0
  set_cost_bbox: 5.0
  set_cost_giou: 2.0
  set_cost_3dcenter: 10.0


optimizer:
  type: 'adamw'
  lr: 0.000005 # Very small LR for 109 classes (was 0.00002)
  weight_decay: 0.0001
  # Add backbone specific LR multiplier if needed (common for fine-tuning)
  # lr_backbone: 0.00001


lr_scheduler:
  type: 'step' # Or 'cosine'
  warmup: True # Enable warmup (important for stability)
  warmup_epochs: 10 # Longer warmup for stability
  warmup_init_lr: 0.0000001 # Extremely small warmup LR (1e-7)
  decay_rate: 0.1
  decay_list: [100, 150] # Adjusted decay steps for 195 epochs


trainer:
  max_epoch: 195 # Keep or adjust based on convergence
  gpu_ids: '0,1,2,3' # Make sure this matches your hardware
  batch_size_per_gpu: 8 # H200 has 128GB, should handle this with DN disabled
  save_frequency: 1 # Reduced frequency to save disk space
  # resume_model: False # Set to True and specify path if resuming
  # pretrain_model: null # Path to load weights from (e.g., DINO backbone only, or full model)
  save_path: 'outputs/monodinodetr_run2/' # Specific output path
  save_all: False # Save only best and latest checkpoints
  # DN parameters (must match model section if DN is enabled)
  use_dn: False # Temporarily disabled to debug OOM
  scalar: 2 # Must match model.scalar
  label_noise_scale: 0.2
  box_noise_scale: 0.4
  num_patterns: 0
  contrastive: False

tester:
  type: *dataset_type # Match dataset type
  mode: 'single'
  checkpoint: 'best' # Use 'best' for best checkpoint, or epoch number like 10, 20, etc.
  threshold: 0.2 # Confidence threshold for evaluation
  topk: 50 # Match num_queries
  use_dn: False # Match model setting